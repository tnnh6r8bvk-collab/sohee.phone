<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My iPhone</title>
<script>
/* ============================================================
   ★ 여기만 고치면 됩니다 (내용 설정) ★
   - keys : 이 단어가 들어간 문자를 보내면 answer 로 답장
   - answer : 문자열 하나, 또는 ["첫째","둘째"] 처럼 여러 개
   - calls : 전화번호(숫자만 비교)와 통화 대사(who 가 "나"면 내 말)
   ============================================================ */
const CONFIG = {
  sms: {
    name: "민지",
    greeting: "안녕! 문자 보내봐 :)",
    fallback: "음… 무슨 말인지 모르겠어 😅",
    replies: [
      { keys: ["안녕", "하이"], answer: "안녕! 오늘 뭐해?" },
      { keys: ["뭐해"], answer: ["그냥 쉬는 중이야", "너는?"] },
      { keys: ["보고싶"], answer: "나도 😊" }
    ]
  },
  kakao: {
    name: "원빈",
    greeting: "왔네! 아무거나 말해봐",
    fallback: "ㅋㅋㅋ 뭐라고?",
    replies: [
      { keys: ["안녕", "ㅎㅇ"], answer: "ㅎㅇㅎㅇ" },
      { keys: ["밥"], answer: "나 아직 안 먹었어. 같이 먹을래?" },
      { keys: ["비밀"], answer: ["쉿…", "이건 우리만 알기로 하자"] }
    ]
  },
  calls: [
    { name: "민지", number: "010-1234-5678", lines: [
      { who: "민지", t: "여보세요? 어, 웬일이야." },
      { who: "나", t: "그냥 목소리 듣고 싶어서 전화했어." },
      { who: "민지", t: "갑자기? 싱겁긴. 나도 반갑다." }
    ]},
    { name: "원빈", number: "010-0000-1111", lines: [
      { who: "원빈", t: "야, 마침 전화하려던 참이었어." },
      { who: "나", t: "무슨 일인데?" },
      { who: "원빈", t: "만나서 얘기하자. 이따 봐." }
    ]}
  ],
  unknown: [{ who: "안내", t: "지금 거신 번호는 없는 번호입니다. 다시 확인하고 걸어주세요." }]
};
</script>
<style>
:root{--screen-w:393px;--screen-h:852px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#cfd4dc;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:#111}
button,input{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
#stage{position:fixed;left:50%;top:50%;width:417px;height:876px;transform-origin:center}
.phone{width:100%;height:100%;border-radius:68px;padding:12px;background:linear-gradient(145deg,#6f7176,#3a3b3f 40%,#55575c);box-shadow:0 30px 70px rgba(20,25,40,.35),inset 0 0 0 2px #8b8d92}
.screen{position:relative;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#000;color:#fff;isolation:isolate}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:54px;padding:18px 34px 0 44px;display:flex;justify-content:space-between;font-weight:600;font-size:16px;z-index:50;pointer-events:none;color:#fff;transition:color .2s}
.screen[data-t=light] .status{color:#000}
.status .r{display:flex;gap:6px;align-items:center;font-size:13px}
.batt{width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.batt::after{content:"";position:absolute;inset:1.5px 6px 1.5px 1.5px;background:currentColor;border-radius:1.5px}
.hbar{position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:#fff;z-index:60;cursor:pointer;box-shadow:0 0 0 .5px rgba(0,0,0,.25);transition:background .2s}
.hbar::before{content:"";position:absolute;inset:-14px -10px}
.screen[data-t=light] .hbar{background:#111}

/* 홈 화면 */
#home{position:absolute;inset:0;background:linear-gradient(165deg,#27406b,#6d5a96 55%,#e39a7e);padding:78px 22px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 0;justify-items:center}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.ic i{width:62px;height:62px;border-radius:15px;display:grid;place-items:center;font-style:normal;font-size:32px;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .12s}
.ic:active i{transform:scale(.9)}
.dock{position:absolute;left:12px;right:12px;bottom:26px;height:96px;border-radius:34px;background:rgba(255,255,255,.28);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:flex;justify-content:space-around;align-items:center;padding:0 6px}
.dock .ic{font-size:0;gap:0}

/* 앱 공통 */
.app{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:scale(.9);transition:opacity .22s,transform .22s;z-index:20}
.app.open{opacity:1;pointer-events:auto;transform:none}
.bar{padding:54px 14px 8px;display:flex;align-items:center;justify-content:space-between;min-height:100px}
.bar b{font-weight:600}
.back{font-size:17px;min-width:60px;text-align:left}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:flex-end;gap:7px;max-width:100%}
.row.me{justify-content:flex-end}
.b{max-width:74%;padding:8px 13px;border-radius:19px;font-size:16px;line-height:1.35;word-break:break-word;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.type .b{letter-spacing:2px;color:#888}
.inp{display:flex;gap:8px;align-items:center;padding:8px 12px 34px}
.inp input{flex:1;height:36px;padding:0 14px;font-size:16px;border-radius:18px}
.send{width:34px;height:34px;border-radius:50%;font-size:17px;font-weight:700;color:#fff}

/* 문자 */
#sms{background:#fff;color:#000}
#sms .bar{background:rgba(247,247,249,.95);border-bottom:.5px solid #d0d0d4;color:#007aff}
#sms .bar b{color:#000;font-size:15px}
#sms .me .b{background:#34c759;color:#fff}
#sms .you .b{background:#e9e9eb;color:#000}
#sms .av{display:none}
#sms .inp input{border:1px solid #c8c8cc}
#sms .send{background:#34c759}

/* 카카오톡 */
#kakao{background:#b2c7d9;color:#000}
#kakao .bar{background:#b2c7d9}
#kakao .bar b{font-size:17px}
#kakao .me .b{background:#fee500;border-radius:14px}
#kakao .you .b{background:#fff;border-radius:14px}
#kakao .av{width:36px;height:36px;border-radius:14px;background:#6c8aa6;color:#fff;display:grid;place-items:center;font-size:15px;align-self:flex-start;flex:none}
#kakao .inp{background:#fff}
#kakao .inp input{background:#f1f1f1;border-radius:6px}
#kakao .send{background:#fee500;color:#222;width:auto;padding:0 12px;border-radius:6px;font-size:14px}

/* 전화 */
#phone{background:#fff;color:#000;align-items:center}
.num{margin-top:96px;height:46px;font-size:34px;font-weight:400;letter-spacing:.5px}
.chips{display:flex;gap:8px;margin:6px 0 14px;min-height:30px}
.chips button{padding:5px 12px;border-radius:15px;background:#f0f0f4;font-size:14px;color:#0a60d0}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:14px 22px}
.keys button{width:78px;height:78px;border-radius:50%;background:#e8e8ed;font-size:32px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.keys button:active{background:#c9c9d0}
.keys small{font-size:10px;letter-spacing:2px;margin-top:-3px;color:#555}
.callrow{display:flex;gap:22px;align-items:center;margin-top:16px}
.callbtn{width:78px;height:78px;border-radius:50%;background:#34c759;font-size:32px;color:#fff}
.del{width:78px;font-size:22px;color:#888}

/* 통화 중 */
#call{background:linear-gradient(180deg,#313846,#10131a);align-items:center;text-align:center}
#call .who{margin-top:110px;font-size:36px;font-weight:500}
#call .st{margin-top:6px;font-size:17px;opacity:.7;height:22px}
#call .face{margin:22px 0 18px;width:96px;height:96px;border-radius:50%;background:#59657a;display:grid;place-items:center;font-size:40px}
.sub{margin:0 22px;width:calc(100% - 44px);min-height:132px;padding:16px 18px;border-radius:22px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:left}
.sub small{display:block;font-size:13px;opacity:.65;margin-bottom:6px}
.sub p{font-size:20px;line-height:1.45;animation:pop .25s ease-out}
.end{position:absolute;bottom:64px;left:50%;margin-left:-37px;width:74px;height:74px;border-radius:50%;background:#ff3b30;font-size:30px;color:#fff;transform:rotate(135deg)}

/* 잠금 화면 */
#lockscreen{position:absolute;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;color:#fff;overflow:hidden;background:radial-gradient(ellipse at 18% 18%,rgba(255,255,255,.92) 0%,rgba(255,255,255,0) 27%),radial-gradient(ellipse at 82% 30%,#f7b4d7 0%,rgba(247,180,215,0) 36%),radial-gradient(ellipse at 22% 64%,#6dc9f5 0%,rgba(109,201,245,0) 43%),radial-gradient(ellipse at 78% 80%,#545edb 0%,rgba(84,94,219,0) 48%),linear-gradient(145deg,#b7e9ff,#9a8be8 48%,#f3a6c6);}
#lockscreen::before{content:"";position:absolute;inset:-15%;background:linear-gradient(135deg,transparent 18%,rgba(255,255,255,.26) 32%,transparent 47%,rgba(255,255,255,.18) 62%,transparent 78%);filter:blur(18px);}
.lock-top{position:relative;margin-top:76px;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.15)}
.lock-date{font-size:17px;font-weight:500;letter-spacing:.2px}
.lock-time{font-size:76px;line-height:1.12;font-weight:300;letter-spacing:-3px}
.lock-bottom{position:absolute;bottom:30px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:16px}
.lock-hint{font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.lock-shortcuts{display:flex;justify-content:space-between;width:100%;padding:0 42px}
.lock-shortcuts span{width:48px;height:48px;border-radius:50%;background:rgba(20,25,40,.25);display:grid;place-items:center;font-size:22px;border:1px solid rgba(255,255,255,.22)}
#passcode{position:absolute;inset:0;z-index:56;display:none;flex-direction:column;align-items:center;padding:90px 28px 35px;background:rgba(30,35,65,.78);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);color:white;text-align:center}
#passcode.show{display:flex}
.pass-title{font-size:23px;font-weight:600;margin-bottom:8px}
.pass-sub{font-size:14px;opacity:.85;margin-bottom:24px}
.pass-dots{display:flex;gap:14px;margin-bottom:30px}
.pass-dots i{width:10px;height:10px;border:1.5px solid #fff;border-radius:50%;display:block}
.pass-dots i.filled{background:#fff}
.pass-keys{display:grid;grid-template-columns:repeat(3,68px);gap:12px 20px;justify-content:center}
.pass-keys button{width:68px;height:68px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.13);color:#fff;font-size:28px;font-weight:400}
.pass-keys button:active{background:rgba(255,255,255,.35)}
.pass-keys .blank{visibility:hidden}.pass-keys .delete{font-size:13px;border:0;background:transparent}
.pass-error{height:20px;font-size:13px;color:#ffd1d1;margin-top:10px}
#lockscreen.hidden{display:none}

</style>
</head>
<body>

 <div class="phone">

<script>
const $ = s => document.querySelector(s);
const screen = $('#screen');
const digits = s => s.replace(/\D/g, '');

/* 크기 맞추기 + 시계 */
function fit(){ const s = Math.min(1, (innerHeight - 20) / 876, (innerWidth - 12) / 417); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();
function tick(){ const d = new Date(); $('#clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
tick(); setInterval(tick, 10000);


/* 잠금 화면 및 암호 */
const LOCK_CODE = '020302';
let enteredCode = '';
function updateLockClock(){
  const d = new Date();
  $('#lock-time').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
  const days = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  $('#lock-date').textContent = (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + days[d.getDay()];
}
function renderDots(){ document.querySelectorAll('#pass-dots i').forEach((dot,i)=>dot.classList.toggle('filled',i<enteredCode.length)); }
function openPasscode(){ $('#passcode').classList.add('show'); enteredCode=''; renderDots(); $('#pass-error').textContent=''; }
function closePasscode(){ $('#passcode').classList.remove('show'); enteredCode=''; renderDots(); }
function unlockPhone(){ $('#lockscreen').classList.add('hidden'); closePasscode(); }
function pressPassKey(k){
  if(k==='delete'){ enteredCode=enteredCode.slice(0,-1); renderDots(); return; }
  if(enteredCode.length>=6) return;
  enteredCode+=k; renderDots();
  if(enteredCode.length===6){
    if(enteredCode===LOCK_CODE){ unlockPhone(); }
    else { $('#pass-error').textContent='암호가 올바르지 않습니다.'; setTimeout(()=>{enteredCode='';renderDots();$('#pass-error').textContent='';},700); }
  }
}
['1','2','3','4','5','6','7','8','9','blank','0','delete'].forEach(k=>{
 const b=document.createElement('button');
 if(k==='blank'){b.className='blank';b.disabled=true;b.textContent='';}
 else if(k==='delete'){b.className='delete';b.textContent='삭제';b.onclick=()=>pressPassKey('delete');}
 else {b.textContent=k;b.onclick=()=>pressPassKey(k);}
 $('#pass-keys').appendChild(b);
});
$('#unlock-open').onclick=openPasscode;
$('#lockscreen').addEventListener('click',e=>{if(e.target.id==='lockscreen'||e.target.classList.contains('lock-top'))openPasscode();});
$('#hbar').addEventListener('click',()=>{if(!$('#lockscreen').classList.contains('hidden'))openPasscode();});
updateLockClock(); setInterval(updateLockClock,10000);

/* 앱 열기/닫기 */
function openApp(id){
  document.querySelectorAll('.app').forEach(a => a.classList.remove('open'));
  if (id) $('#' + id).classList.add('open');
  screen.dataset.t = (!id || id === 'call') ? 'dark' : 'light';
}
function goHome(){ clearCall(); openApp(null); }
document.querySelectorAll('[data-app]').forEach(b => b.onclick = () => openApp(b.dataset.app));
document.querySelectorAll('[data-home]').forEach(b => b.onclick = goHome);
$('#hbar').onclick = goHome;

/* 문자 / 카카오톡 공통 채팅 */
function makeChat(id, cfg){
  const root = $('#' + id), box = root.querySelector('.msgs'), inp = root.querySelector('input');
  $('#' + id + '-name').textContent = cfg.name;
  function add(text, me, cls){
    const r = document.createElement('div'); r.className = 'row ' + (me ? 'me' : 'you') + (cls ? ' ' + cls : '');
    r.innerHTML = (me ? '' : '<span class="av"></span>') + '<div class="b"></div>';
    r.querySelector('.av') && (r.querySelector('.av').textContent = cfg.name[0]);
    r.querySelector('.b').textContent = text;
    box.appendChild(r); box.scrollTop = box.scrollHeight; return r;
  }
  function reply(list, i = 0){
    if (i >= list.length) return;
    const t = add('···', false, 'type');
    setTimeout(() => { t.remove(); add(list[i], false); reply(list, i + 1); }, 700 + Math.random() * 500);
  }
  function send(){
    const v = inp.value.trim(); if (!v) return;
    add(v, true); inp.value = '';
    const n = v.replace(/\s/g, '').toLowerCase();
    const hit = cfg.replies.find(r => r.keys.some(k => n.includes(k.replace(/\s/g, '').toLowerCase())));
    const a = hit ? hit.answer : cfg.fallback;
    setTimeout(() => reply(Array.isArray(a) ? a : [a]), 400);
  }
  root.querySelector('.send').onclick = send;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) send(); });
  add(cfg.greeting, false);
}
makeChat('sms', CONFIG.sms);
makeChat('kakao', CONFIG.kakao);

/* 전화 키패드 */
let cur = '';
const fmt = d => d.length === 11 ? d.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3') : d.length === 10 ? d.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3') : d;
const show = () => $('#num').textContent = fmt(cur);
const sub = {2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'};
['1','2','3','4','5','6','7','8','9','*','0','#'].forEach(k => {
  const b = document.createElement('button');
  b.innerHTML = k + (sub[k] ? '<small>' + sub[k] + '</small>' : '');
  b.onclick = () => { if (cur.length < 15) { cur += k; show(); } };
  $('#keys').appendChild(b);
});
$('#del').onclick = () => { cur = cur.slice(0, -1); show(); };
CONFIG.calls.forEach(c => {
  const b = document.createElement('button'); b.textContent = c.name;
  b.onclick = () => { cur = digits(c.number); show(); };
  $('#chips').appendChild(b);
});
$('#dial').onclick = () => startCall(cur);

/* 통화 (대사 출력) */
let timers = [], clock = null;
const later = (f, ms) => timers.push(setTimeout(f, ms));
function clearCall(){ timers.splice(0).forEach(clearTimeout); clearInterval(clock); }
function startCall(raw){
  const d = digits(raw); if (!d) return;
  clearCall();
  const c = CONFIG.calls.find(x => digits(x.number) === d);
  const lines = c ? c.lines : CONFIG.unknown;
  $('#cname').textContent = c ? c.name : fmt(d);
  $('#cface').textContent = c ? c.name[0] : '👤';
  $('#cstat').textContent = '발신 중…';
  $('#spk').textContent = ''; $('#line').textContent = '';
  openApp('call');
  later(() => {
    let sec = 0;
    $('#cstat').textContent = '00:00';
    clock = setInterval(() => { sec++; $('#cstat').textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }, 1000);
    const step = i => {
      if (i >= lines.length) { later(endCall, 2500); return; }
      const l = lines[i], p = $('#line');
      $('#spk').textContent = l.who;
      p.style.animation = 'none'; void p.offsetWidth; p.style.animation = '';
      p.textContent = l.t;
      later(() => step(i + 1), Math.max(2400, l.t.length * 130));
    };
    step(0);
  }, 2000);
}
function endCall(){
  clearCall();
  $('#cstat').textContent = '통화 종료';
  later(() => { cur = ''; show(); openApp('phone'); }, 800);
}
$('#end').onclick = endCall;
</script>
</body>
</html>
